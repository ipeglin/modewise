name: Release

# Runs on version tags (v*) or by hand. Not on every push: macOS and Windows
# minutes cost 10x and 2x on private repositories.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, name: linux-x86_64 }
          - { os: ubuntu-latest, target: aarch64, name: linux-aarch64 }
          - { os: macos-latest, target: aarch64, name: macos-arm64 }
          - { os: macos-latest, target: x86_64, name: macos-x86_64 }
          - { os: windows-latest, target: x64, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: drivers/python
          target: ${{ matrix.target }}
          manylinux: "2014"
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.name }}
          path: drivers/python/dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: drivers/python
          command: sdist
          args: --out dist
      - name: The source distribution builds and imports
        run: |
          python3 -m venv /tmp/sdist && /tmp/sdist/bin/pip install -q drivers/python/dist/*.tar.gz
          /tmp/sdist/bin/python -c "import modewise; print(modewise.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: drivers/python/dist/*.tar.gz

  test:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.name }}
          path: wheels
      - name: Install the wheel and run unit and glass-to-glass tests
        shell: bash
        run: |
          python -m pip install --find-links wheels modewise pytest h5py xarray pandas "zarr>=3"
          python -m pytest -q drivers/python/tests tests/e2e

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from the annotated tag message (no auto-generated author mentions)
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" > notes.md
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: wheels/*.whl
          body_path: notes.md

  # PyPI trusted publishing: no token is stored. Register this repository, this workflow file and
  # the "pypi" environment as a trusted publisher of the modewise project on pypi.org first.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
