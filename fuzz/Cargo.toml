[package]
name = "modewise-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
modewise_dataset = { path = "../adapters/dataset" }
modewise_operations = { path = "../application/operations" }
modewise_pipeline = { path = "../application/pipeline" }

[[bin]]
name = "pipeline_spec"
path = "fuzz_targets/pipeline_spec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dataset_spec"
path = "fuzz_targets/dataset_spec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pattern"
path = "fuzz_targets/pattern.rs"
test = false
doc = false
bench = false

[workspace]
