# Connectomes for fingerprinting (Finn et al. 2015): the full band and two octave bands.
[pipeline]
name = "connectomes"
inputs = ["bold"]

[[step]]
id = "full"
op = "functional_connectivity"
input = "bold"
params = { measure = "pearson" }

# Octaves at 1.25 Hz: mode 1 is D6 (about 0.010–0.020 Hz), mode 3 is D4 (about 0.039–0.078 Hz).
# Only the connectivity is stored; the modes and band signals stay in memory.
[[step]]
id = "octaves"
op = "modwt_mra"
input = "bold"
params = { wavelet = "sym4", levels = 6, boundary = "reflection" }
keep = false

[[step]]
id = "slow"
op = "reconstruct"
input = "octaves"
params = { modes = [1] }
keep = false

[[step]]
id = "fast"
op = "reconstruct"
input = "octaves"
params = { modes = [3] }
keep = false

[[step]]
id = "slow_fc"
op = "functional_connectivity"
input = "slow"
params = { measure = "pearson" }

[[step]]
id = "fast_fc"
op = "functional_connectivity"
input = "fast"
params = { measure = "pearson" }
