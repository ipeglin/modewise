# TCP (ds005237): the first restAP run of every subject, downloaded by ../fetch_tcp.py.
root = "../data/ds005237"
filter = { task = ["restAP"], run = ["01"] }

[[input]]
name = "bold"
pattern = "fMRI_timeseries_clean_denoised_GSR_parcellated/NDAR_{subject}/task-{task}_run-{run}_bold_Atlas_hp2000_clean_GSR_parcellated.h5"
format = "hdf5"
dataset = "dataset"
sidecar = "sub-NDAR{subject}/func/sub-NDAR{subject}_task-{task}_run-{run}_bold.json"

[channels]
tables = [{ path = "../../tcp/channels.tsv", format = "tsv" }]
names_for = ["bold"]

[participants]
tables = [{ path = "participants.tsv", id_pattern = "sub-NDAR{subject}" }]
